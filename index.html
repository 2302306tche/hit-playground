<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>타격 놀이터</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🥊 타격 놀이터</h1>

        <p class="description">
            화면을 클릭해서 움직이는 목표물을 맞혀보세요!
        </p>

        <div class="info">
            <div>점수: <span id="score">0</span></div>
            <div>시간: <span id="time">30</span>초</div>
        </div>

        <div id="gameArea">

            <button id="target">
                🎯
            </button>

        </div>

        <button id="startButton">
            게임 시작
        </button>

        <p id="message">
            게임 시작 버튼을 눌러주세요.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
